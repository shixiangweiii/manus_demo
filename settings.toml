[llm]
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
timeout_seconds = 120.0
retry_enabled = false
retry_max_attempts = 3
retry_backoff_factor = 2.0
token_tracking = true
reasoning_token_tracking = true

[runtime]
engine = "agent_loop"
effort = "auto"

[engines]
max_replan_attempts = 3
max_parallel_nodes = 3
dag_serial_execution = true
node_timeout_seconds = 300
adaptive_planning = true
adaptive_interval = 1
adaptive_min_completed = 1
max_agent_turns = 30
agent_timeout_seconds = 600.0
planner_temperature = 0.3
reflector_temperature = 0.1

[execution]
max_context_tokens = 16000
max_action_iterations = 10
tool_calling_temperature = 0.5
max_reasoning_tokens = 10000

[paths]
state_dir = "~/.manus_demo"
sandbox_dir = "~/.manus_demo/sandbox"
checkpoint_dir = "~/.manus_demo/checkpoints"
knowledge_docs_dir = "knowledge/docs"

[tools]
python_command = "python3"
shell_mode = "trusted"
python_mode = "trusted"
code_timeout_seconds = 30
shell_timeout_seconds = 30
subprocess_max_output_bytes = 524288
shell_max_concurrent = 3
code_max_concurrent = 3
failure_threshold = 2
result_truncation_limit = 2000
web_search_max_results = 5
web_search_timeout_seconds = 15
user_location = ""
location_ip_lookup = true
location_ssl_verify = false
bailian_websearch_url = "https://dashscope.aliyuncs.com/api/v1/mcps/WebSearch/mcp"
bailian_webparser_url = "https://dashscope.aliyuncs.com/api/v1/mcps/WebParser/sse"
bailian_max_retries = 3
bailian_retry_base_delay = 2.0
bailian_webparser_max_concurrent = 1
bailian_webparser_min_interval = 1.0
search_convergence_threshold = 3
fetch_url_max_content_length = 10000
fetch_url_short_warning_length = 80
local_webparser_enabled = true
local_webparser_timeout = 20.0
local_webparser_max_bytes = 2097152
local_webparser_user_agent = "ManusDemoBot/1.0"
local_webparser_respect_robots = false
local_webparser_browser_fallback = false
local_webparser_fallback_to_bailian = false
local_webparser_min_content_length = 120
local_webparser_cache_size = 64

[capabilities]
checkpoint = true
checkpoint_max_per_task = 5
subagent = false
subagent_max_iterations = 10
subagent_timeout_seconds = 300
subagent_max_concurrent = 2
subagent_max_calls = 3
subagent_max_tokens = 120000
subagent_tool_whitelist = ""
subagent_task_max_length = 2000
hitl = false
hitl_max_prompts = 5
hitl_timeout_seconds = 120
agentic_memory = false
memory_tools = false
memory_min_confidence = 0.35
memory_search_top_k = 3
memory_llm_consolidation = false
short_term_window = 20
knowledge = true
knowledge_chunk_size = 500
knowledge_top_k = 3
self_evolution = false
self_evolution_llm_extraction = false
self_evolution_max_hints = 3
self_evolution_confidence_cap = 0.6
skills = false
skills_user_dir = "~/.manus_demo/skills"
skills_dirs = ""
skills_max_activations = 3
skills_max_content_tokens = 5000
skill_auto_distill = false
skill_auto_distill_min_successes = 3
skill_auto_distill_confidence_cap = 0.55
skill_optimize_with_llm = false
skill_optimize_validation_ratio = 0.2
skill_optimize_max_tokens = 1200
guardrails = false
guardrail_tool_enabled = true
guardrail_input_enabled = true
guardrail_output_enabled = true
guardrail_tool_mode = "block"
guardrail_input_mode = "neutralize"
guardrail_output_mode = "redact"
guardrail_write_confirm = "block"
mcp_bridge = false
mcp_bridge_config_path = ""
mcp_bridge_servers_json = ""
mcp_bridge_tool_prefix = "mcp"
mcp_bridge_schema_mode = "loose"
mcp_bridge_discovery_ttl = 300
mcp_bridge_call_timeout = 30
mcp_server_transport = "streamable_http"
mcp_server_host = "127.0.0.1"
mcp_server_port = 8080
mcp_server_expose_agent = false
agentbay = false
agentbay_code_tool = true
agentbay_browser_tool = true
agentbay_log_level = "WARNING"
agentbay_max_concurrent = 1
agentbay_code_image = "code_latest"
agentbay_browser_image = "browser_latest"
agentbay_idle_release_minutes = 5
agentbay_max_runtime_minutes = 10
agentbay_code_timeout_seconds = 60
agentbay_browser_timeout_ms = 30000

[tracing]
enabled = true
backend = "file"
endpoint = "http://localhost:4318"
service_name = "manus-demo"
sample_rate = 1.0
log_prompts = true
max_attribute_length = 1000
output_dir = "traces"

[webui]
host = "127.0.0.1"
port = 8700

[evaluation]
output_dir = "~/.manus_demo/evaluation"
port = 8720
max_document_chars = 24000
default_num_tasks = 6
generation_max_tokens = 4096
